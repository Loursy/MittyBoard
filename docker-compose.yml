services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mittyboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mittyboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mittyboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mittyboard
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Single dash, not double: `:-` treats an explicitly empty
        # VITE_API_URL (same-origin/relative API calls, e.g. behind the
        # nginx+domain EC2 setup) as "unset" and silently falls back to the
        # default — `-` only falls back when the var is truly undefined.
        VITE_API_URL: ${VITE_API_URL-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mittyboard-db-data:
