server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed static assets aggressively; index.html itself must always
    # be revalidated so deploys are picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (react-router): let unknown paths fall through to
    # index.html instead of 404ing on a hard refresh / direct link.
    location / {
        try_files $uri /index.html;
    }
}
